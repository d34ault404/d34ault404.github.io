  <style>
    * {

    .container {
      width: 100%;

    /* Original Banner Box (Neon Purple Glow Border) */

      margin: 0 auto 16px auto;

    .avatar-wrapper:hover {

    /* Links Stack */

  <!-- Horizontal Word Rain Script with Red Glitch Highlight -->
  <script>
    const canvas = document.getElementById('rain-canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const targetWords = ["404", "DEFAULT", "ERROR", "D34AULT", "404", "ERROR", "DEFAULT", "SYSTEM", "GLITCH"];
    const fontSize = 14;
    const columns = Math.floor(window.innerWidth / 35);

    const drops = [];
    for (let x = 0; x < columns; x++) {
      drops[x] = {
        y: Math.random() * -100,
        word: targetWords[Math.floor(Math.random() * targetWords.length)]
      };
    }

    let globalGlitchFrame = 0;

    function drawRain() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.font = '700 ' + fontSize + 'px monospace';
      globalGlitchFrame++;

      const wavePattern = Math.sin(globalGlitchFrame * 0.05);

      for (let i = 0; i < columns; i++) {
        const drop = drops[i];
        const x = i * 35;
        const y = drop.y * fontSize;

        const isTargetWord = ["DEFAULT", "404", "ERROR"].includes(drop.word);
        const isGlitchActive = (isTargetWord && Math.random() < 0.22) || (Math.sin(i + wavePattern * 5) > 0.85);

        // Highlight turned RED (#ff0033) instead of blue (#00d8ff)
        if (isGlitchActive) {
          ctx.fillStyle = '#ff0033';
          ctx.shadowColor = '#ff0033';
          ctx.shadowBlur = 10;
        } else {
          ctx.fillStyle = '#00ff66';
          ctx.shadowColor = 'transparent';
          ctx.shadowBlur = 0;
        }

        ctx.fillText(drop.word, x, y);

        if (y > canvas.height && Math.random() > 0.975) {
          drop.y = 0;
          drop.word = targetWords[Math.floor(Math.random() * targetWords.length)];
        }

        drop.y++;
      }
    }

    setInterval(drawRain, 40);
  </script>

</body>
