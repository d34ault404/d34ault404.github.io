  <script>
    const canvas = document.getElementById('rain-canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Rain word pool including glitch terms and your favorite games
    const words = [
      "404", "ERROR", "DEFAULT", "D34AULT", "01", "FAIL", "SYSTEM", "GLITCH",
      "PUBG", "ELDEN RING", "DAYZ", "RED DEAD", "WITCHER 3", "DOTA 2", 
      "TSUSHIMA", "ONCE HUMAN", "GTA V", "GOD OF WAR", "CITIES SKYLINES"
    ];
    
    const fontSize = 13;
    const columns = Math.floor(window.innerWidth / 32);

    const drops = [];
    for (let x = 0; x < columns; x++) {
      drops[x] = Math.random() * -100;
    }

    function drawRain() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.font = fontSize + 'px monospace';

      for (let i = 0; i < drops.length; i++) {
        const text = words[Math.floor(Math.random() * words.length)];
        const x = i * 32;
        const y = drops[i] * fontSize;

        const rand = Math.random();
        if (rand < 0.08) {
          ctx.fillStyle = '#a855f7'; // Purple glow accent
        } else if (rand < 0.15) {
          ctx.fillStyle = '#ff0033'; // Red error alert
        } else {
          ctx.fillStyle = '#00ff66'; // Matrix green
        }

        ctx.fillText(text, x, y);

        if (y > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }

        drops[i]++;
      }
    }

    setInterval(drawRain, 40);
  </script>
