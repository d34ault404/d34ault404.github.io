  <script>
    const canvas = document.getElementById('rain-canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const words = [
      "404", "ERROR", "DEFAULT", "D34AULT", "01", "FAIL", "SYSTEM", "GLITCH", "KICK",
      "CS2", "DOTA 2", "THE ISLE", "TLOU II", "PUBG", "AC VALHALLA",
      "CALL OF DUTY", "CITIES SKYLINES II", "DAYZ", "ELDEN RING", "FINAL FANTASY XVI",
      "GHOST OF TSUSHIMA", "GTA V", "GUILD WARS 2", "TLOU PART I", "ONCE HUMAN",
      "RED DEAD ONLINE", "RED DEAD 2", "SNIPER ELITE 5", "STRONGHOLD", "TRANSPORT FEVER 2",
      "VICTORIA 3", "VIKING RISE", "WAR THUNDER", "SPACE MARINE 2", "WHERE WINDS MEET",
      "WITCHER 3", "WORLD OF TANKS", "AOE II", "AMONG US", "BATTLEFIELD V", "DESTINY 2", "DIABLO IV"
    ];
    
    const fontSize = 13;
    const columns = Math.floor(window.innerWidth / 32);

    const drops = [];
    for (let x = 0; x < columns; x++) {
      drops[x] = Math.random() * -100;
    }

    function drawRain() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.font = fontSize + 'px monospace';

      for (let i = 0; i < drops.length; i++) {
        const text = words[Math.floor(Math.random() * words.length)];
        const x = i * 32;
        const y = drops[i] * fontSize;

        const rand = Math.random();
        if (rand < 0.08) {
          ctx.fillStyle = '#a855f7';
        } else if (rand < 0.15) {
          ctx.fillStyle = '#ff0033';
        } else if (rand < 0.22) {
          ctx.fillStyle = '#53fc18';
        } else {
          ctx.fillStyle = '#00ff66';
        }

        ctx.fillText(text, x, y);

        if (y > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }

        drops[i]++;
      }
    }

    setInterval(drawRain, 40);
  </script>
