  <!-- Glitching Digital Code Rain Script -->
  <script>
    const canvas = document.getElementById('rain-canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Words & Glitch Tokens
    const words = ["404", "ERROR", "DEFAULT", "D34AULT", "01", "404", "FAIL", "SYSTEM", "GLITCH"];
    const fontSize = 14;
    const columns = Math.floor(window.innerWidth / 30);

    const drops = [];
    for (let x = 0; x < columns; x++) {
      drops[x] = Math.random() * -100;
    }

    function drawRain() {
      // Trail effect
      ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.font = fontSize + 'px monospace';

      for (let i = 0; i < drops.length; i++) {
        const text = words[Math.floor(Math.random() * words.length)];
        const x = i * 30;
        const y = drops[i] * fontSize;

        // Glitch chance: 5% chance a word flashes red glitch color
        if (Math.random() < 0.05) {
          ctx.fillStyle = '#ff0033'; // Glitch red pulse
        } else {
          ctx.fillStyle = '#00ff66'; // Standard Matrix green
        }

        ctx.fillText(text, x, y);

        if (y > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }

        drops[i]++;
      }
    }

    setInterval(drawRain, 40);
  </script>
