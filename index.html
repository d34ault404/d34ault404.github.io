<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D34AULT404 | Links</title>
  
  <!-- Font Awesome Icons & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      /* Cool animated radial glow background */
      background: radial-gradient(circle at center, #1b0a0a 0%, #08080a 70%, #000000 100%);
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      overflow-x: hidden;
    }

    /* Ambient background glow */
    body::before {
      content: '';
      position: absolute;
      width: 300px;
      height: 300px;
      background: rgba(255, 42, 42, 0.15);
      filter: blur(120px);
      border-radius: 50%;
      z-index: -1;
    }

    .container {
      width: 100%;
      max-width: 420px;
      text-align: center;
      z-index: 1;
    }

    /* Fixed Banner/Avatar Container - Holds wide images without squishing */
    .avatar-wrapper {
      width: 100%;
      max-width: 220px;
      margin: 0 auto 16px auto;
      border-radius: 12px;
      padding: 4px;
      background: linear-gradient(135deg, #ff2a2a, rgba(255, 42, 42, 0.2));
      box-shadow: 0 0 25px rgba(255, 42, 42, 0.35);
      transition: transform 0.3s ease;
    }

    .avatar-wrapper:hover {
      transform: scale(1.03);
    }

    .avatar {
      width: 100%;
      height: auto;
      border-radius: 8px;
      display: block;
      object-fit: contain;
    }

    h1 {
      font-family: 'Rajdhani', sans-serif;
      font-size: 2.2rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
      margin-bottom: 4px;
    }

    .subtitle {
      color: #8a8a99;
      font-size: 0.95rem;
      margin-bottom: 28px;
      font-weight: 500;
    }

    /* Links Stack */
    .links-wrapper {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link-card {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: rgba(20, 20, 25, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #ffffff;
      text-decoration: none;
      padding: 16px 20px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 1.05rem;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    .link-card i {
      font-size: 1.3rem;
    }

    /* Individual Brand Colors on Hover */
    .link-card.twitch:hover { border-color: #9146ff; box-shadow: 0 0 20px rgba(145, 70, 255, 0.4); background: rgba(145, 70, 255, 0.15); transform: translateY(-3px); }
    .link-card.youtube:hover { border-color: #ff0000; box-shadow: 0 0 20px rgba(255, 0, 0, 0.4); background: rgba(255, 0, 0, 0.15); transform: translateY(-3px); }
    .link-card.tiktok:hover { border-color: #00f2fe; box-shadow: 0 0 20px rgba(0, 242, 254, 0.4); background: rgba(0, 242, 254, 0.15); transform: translateY(-3px); }
    .link-card.discord:hover { border-color: #5865f2; box-shadow: 0 0 20px rgba(88, 101, 242, 0.4); background: rgba(88, 101, 242, 0.15); transform: translateY(-3px); }
    .link-card.steam:hover { border-color: #ffffff; box-shadow: 0 0 20px rgba(255, 255, 255, 0.3); background: rgba(255, 255, 255, 0.12); transform: translateY(-3px); }

    footer {
      margin-top: 36px;
      font-size: 0.8rem;
      color: #444455;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Updated Banner Box (keeps image ratio clean) -->
    <div class="avatar-wrapper">
      <img src="https://raw.githubusercontent.com/d34ault404/d34ault404.github.io/main/banner.png" alt="D34AULT404 Logo" class="avatar" onerror="this.src='https://via.placeholder.com/220x80/111/ff2a2a?text=D34AULT404'">
    </div>
    
    <h1>D34AULT404</h1>
    <p class="subtitle">Content Creator & Streamer</p>

    <div class="links-wrapper">
      <a href="https://www.twitch.tv/d34ault404" target="_blank" class="link-card twitch">
        <i class="fa-brands fa-twitch"></i> Twitch
      </a>

      <a href="https://youtube.com/@d34ault404" target="_blank" class="link-card youtube">
        <i class="fa-brands fa-youtube"></i> YouTube
      </a>

      <a href="https://www.tiktok.com/@d34ault404" target="_blank" class="link-card tiktok">
        <i class="fa-brands fa-tiktok"></i> TikTok
      </a>

      <a href="https://discord.gg/89XEFrEqr" target="_blank" class="link-card discord">
        <i class="fa-brands fa-discord"></i> Discord Community
      </a>

      <a href="https://steamcommunity.com/profiles/76561198350190349/" target="_blank" class="link-card steam">
        <i class="fa-brands fa-steam"></i> Steam Profile
      </a>
    </div>

    <footer>
      &copy; D34AULT404
    </footer>
  </div>

</body>
</html>
