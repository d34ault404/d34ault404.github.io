  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;

    body {
      background-color: #0b0c10;
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      display: flex;

      padding: 20px;
    }

    .container {

      text-align: center;
    }

    /* Avatar Glow Effect */
    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 3px solid #ff2a2a;
      box-shadow: 0 0 15px rgba(255, 42, 42, 0.5);
      margin-bottom: 12px;
      object-fit: cover;
    }

    h1 {
      font-family: 'Rajdhani', sans-serif;
      font-size: 2rem;

      font-size: 0.95rem;
      margin-bottom: 24px;
    }

    /* Links Stack */
    .links-wrapper {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link-card {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
      color: #ffffff;
      text-decoration: none;
      padding: 16px 20px;
      border-radius: 12px;
      font-weight: 500;
      font-size: 1.05rem;
      transition: all 0.25s ease;
    }

    /* Hover States */
    .link-card:hover {
      transform: translateY(-3px);
      background: rgba(255, 42, 42, 0.15);
      border-color: #ff2a2a;
      box-shadow: 0 5px 15px rgba(255, 42, 42, 0.3);
    }

    .link-card i {
      font-size: 1.3rem;
    }

    /* Individual Brand Colors on Hover */
    .link-card.twitch:hover { border-color: #9146ff; box-shadow: 0 5px 15px rgba(145, 70, 255, 0.3); background: rgba(145, 70, 255, 0.15); }
    .link-card.youtube:hover { border-color: #ff0000; box-shadow: 0 5px 15px rgba(255, 0, 0, 0.3); background: rgba(255, 0, 0, 0.15); }
    .link-card.tiktok:hover { border-color: #00f2fe; box-shadow: 0 5px 15px rgba(0, 242, 254, 0.3); background: rgba(0, 242, 254, 0.15); }
    .link-card.discord:hover { border-color: #5865f2; box-shadow: 0 5px 15px rgba(88, 101, 242, 0.3); background: rgba(88, 101, 242, 0.15); }
    .link-card.steam:hover { border-color: #171a21; box-shadow: 0 5px 15px rgba(255, 255, 255, 0.2); background: rgba(255, 255, 255, 0.1); }

    footer {

      font-size: 0.8rem;
